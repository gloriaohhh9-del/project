# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: aura
    runtime: python
    plan: free # all data lives in Firebase, so no disk is needed
    buildCommand: pip install -r requirements.txt
    # One worker process: analysis jobs live in that process's memory, so
    # every request must reach the same one. Threads handle concurrency.
    # The long timeout covers artwork edits, which wait on the image model.
    startCommand: gunicorn app:app --workers 1 --threads 8 --timeout 600 --bind 0.0.0.0:$PORT
    healthCheckPath: /
    envVars:
      # Keep glibc from holding freed memory: few per-thread arenas, and
      # large arrays mapped directly so freeing them returns the memory.
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: MALLOC_MMAP_THRESHOLD_
        value: "1048576"
      - key: SECRET_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: FIREBASE_CREDENTIALS
        sync: false # paste the service-account JSON in the Render dashboard
      - key: OPENAI_API_KEY
        sync: false # entered in the Render dashboard, never committed
      - key: GEMINI_API_KEY
        sync: false # Google key for the 8-second AI video; entered in the Render dashboard
      - key: IMAGE_QUALITY
        value: high
      # Tracks allowed in progress at once; more uploads get a "busy, try
      # again shortly" message instead of overloading the server.
      - key: MAX_ACTIVE_JOBS
        value: "5"
